version: '3.8'

# 80/443 は持たず、入口は共有 nginx（arch-test-app/edge-proxy）が担う。
# 前提: docker network create edge
services:
  backend:
    build:
      context: ./backend
    user: "root"
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - ALLOWED_ORIGIN=http://localhost
    volumes:
      - typing_data:/app/data
    restart: always

  frontend:
    build:
      context: ./frontend
    expose:
      - "80"
    depends_on:
      - backend
    volumes:
      # 管理者画面のBasic認証ファイル（secrets/.htpasswd）。リポジトリには含めない
      - ./secrets:/etc/nginx/secrets:ro
    networks:
      default: {}
      edge:
        aliases:
          - typing-frontend   # edge-proxy からはこの名前で到達する
    restart: always

volumes:
  typing_data:

networks:
  edge:
    external: true
