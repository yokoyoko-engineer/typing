# TLS 終端・HTTP→HTTPS リダイレクトは前段の共有 nginx（edge-proxy）が行う。
# このコンテナはポートを公開せず、Docker ネットワーク経由で HTTP だけ受ける。
server {
    listen 80;
    server_name typing.entrycl.net _;

    # 前段 nginx が付けた X-Real-IP を実クライアント IP として採用する。
    # これがないと下の allow/deny が全員「edge-proxy の IP」と判定してしまう。
    # このコンテナにはホストのポートが無く、届くのは Docker 内部（プライベート
    # アドレス）からだけなので、プライベート帯を信頼してよい。
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security Headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ws: wss:; img-src 'self' data:;" always;

    # SPAフォールバック
    location / {
        # ユーザ画面へのアクセス許可IP
        allow 118.237.255.201;
        allow 221.241.89.198;
        allow 159.28.220.152;
        allow 115.163.4.22;
        allow 218.231.76.167;
        allow 218.231.75.186;
        allow 218.231.75.185;
        deny all;

        try_files $uri $uri/ /index.html;
    }

    # 管理者画面へのアクセス制限（React Routerでのクライアントサイドのルーティングも考慮し、/admin パスへの直接アクセスを制限）
    location /admin {
        # 管理者画面へのアクセス許可IP
        allow 221.241.89.198;
        allow 218.231.76.167;
        allow 218.231.75.186;
        allow 218.231.75.185;
        deny all;

        # Basic認証（許可IP かつ 認証成功 の両方を満たす場合のみ通す）
        satisfy all;
        auth_basic "Admin Area";
        auth_basic_user_file /etc/nginx/secrets/.htpasswd;

        try_files $uri $uri/ /index.html;
    }

    # Socket.io リバースプロキシ
    location /socket.io {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # API リバースプロキシ
    location /api {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静的ファイルキャッシュ
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
